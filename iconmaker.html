<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Icon Maker — Flow Field</title>
<style>
  :root{
    --bg:#07080d; --panel:#10131c; --panel2:#161a26; --panel3:#1c2130;
    --border:#242a3a; --borderStrong:#333a4d; --text:#eef0f7; --dim:#8b90a6;
    --accent:#7c5cff; --accent2:#a58bff;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100%; overscroll-behavior:none; touch-action:manipulation;
  }
  .wrap{
    max-width:520px; margin:0 auto;
    padding:env(safe-area-inset-top,0px) 16px calc(env(safe-area-inset-bottom,0px) + 24px) 16px;
    display:flex; flex-direction:column; gap:14px;
  }
  h1{ margin:16px 0 0; font-size:22px; font-weight:800; text-align:center;
      background:linear-gradient(135deg,var(--text),var(--accent2));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  h2{ margin:0; font-size:11px; text-transform:uppercase; letter-spacing:.1em;
  document.getElementById("btn192").addEventListener("click", function () { download("icon-192.png",     192, 0.06); });
