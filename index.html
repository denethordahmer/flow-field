<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<title>Flow Field</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="flow.css">
</head>
<body>

<div class="appWrap">

  <!-- ── Canvas fills everything ── -->
  <canvas id="flowCanvas"></canvas>

  <!-- ── Top bar (minimal — title + randomize) ── -->
  <div class="topBar">
    <span class="topTitle">Flow Field</span>
    <button id="btnRandomize" class="iconBtn" title="Randomize">⟳</button>
    <button id="btnExport" class="iconBtn" title="Export PNG">↓</button>
  </div>

  <!-- ── Bottom sheet ── -->
  <div class="sheet" id="sheet">

    <!-- Handle — tap to open/close -->
    <div class="sheetHandle" id="sheetHandle">
      <div class="sheetPill"></div>
      <span class="sheetLabel" id="sheetLabel">Settings</span>
      <button id="btnGenerate" class="generateBtn">Generate</button>
    </div>

    <!-- Settings list — visible when sheet is open -->
    <div class="settingsList" id="settingsList">

      <!-- ── FLOW ── -->
      <div class="settingsGroup">
        <div class="groupLabel">Flow</div>

        <div class="settingRow" data-key="particles">
          <div class="settingRowInner">
            <span class="settingName">Particles</span>
            <span class="settingVal" id="particlesVal">1200</span>
          </div>
          <div class="settingControl">
            <input type="range" id="particles" min="150" max="4000" step="50" value="1200" class="bigSlider">
          </div>
        </div>

        <div class="settingRow" data-key="steps">
          <div class="settingRowInner">
            <span class="settingName">Flow length</span>
            <span class="settingVal" id="stepsVal">60</span>
          </div>
          <div class="settingControl">
            <input type="range" id="steps" min="10" max="250" step="5" value="60" class="bigSlider">
          </div>
        </div>

        <div class="settingRow" data-key="stepSize">
          <div class="settingRowInner">
            <span class="settingName">Step size</span>
            <span class="settingVal" id="stepSizeVal">3</span>
          </div>
          <div class="settingControl">
            <input type="range" id="stepSize" min="1" max="12" step="1" value="3" class="bigSlider">
          </div>
        </div>

        <div class="settingRow" data-key="featureSize">
          <div class="settingRowInner">
            <span class="settingName">Feature size</span>
            <span class="settingVal" id="featureSizeVal">70</span>
          </div>
          <div class="settingControl">
            <input type="range" id="featureSize" min="1" max="100" step="1" value="70" class="bigSlider">
          </div>
        </div>

        <div class="settingRow" data-key="curl">
          <div class="settingRowInner">
            <span class="settingName">Bend (curl)</span>
            <span class="settingVal" id="curlVal">0.9</span>
          </div>
          <div class="settingControl">
            <input type="range" id="curl" min="0.1" max="3" step="0.05" value="0.9" class="bigSlider">
          </div>
        </div>
      </div>

      <!-- ── STYLE ── -->
      <div class="settingsGroup">
        <div class="groupLabel">Style</div>

        <div class="settingRow" data-key="lineWidth">
          <div class="settingRowInner">
            <span class="settingName">Line width</span>
            <span class="settingVal" id="lineWidthVal">1.3</span>
          </div>
          <div class="settingControl">
            <input type="range" id="lineWidth" min="0.5" max="5" step="0.1" value="1.3" class="bigSlider">
          </div>
        </div>

        <div class="settingRow" data-key="opacity">
          <div class="settingRowInner">
            <span class="settingName">Opacity</span>
            <span class="settingVal" id="opacityVal">0.5</span>
          </div>
          <div class="settingControl">
            <input type="range" id="opacity" min="0.05" max="1" step="0.05" value="0.5" class="bigSlider">
          </div>
        </div>

        <div class="settingRow" data-key="colorMode">
          <div class="settingRowInner">
            <span class="settingName">Color mode</span>
            <span class="settingVal" id="colorModeVal">Gradient</span>
          </div>
          <div class="settingControl">
            <select id="colorMode" class="bigSelect">
              <option value="solid">Solid</option>
              <option value="gradient" selected>Gradient (2-color)</option>
              <option value="tricolor">Tri-color (3-stop)</option>
              <option value="multistop">Multi-stop (4-color)</option>
              <option value="spectrum">Spectrum (full rainbow)</option>
              <option value="monochrome">Monochrome ramp</option>
              <option value="duotone">Duotone</option>
              <option value="complementary">Complementary (auto)</option>
              <option value="splitcomp">Split-complementary (auto)</option>
              <option value="analogous">Analogous (auto)</option>
              <option value="triadic">Triadic (auto)</option>
              <option value="tetradic">Tetradic (auto)</option>
              <option value="warm">Warm palette</option>
              <option value="cool">Cool palette</option>
              <option value="noise">Noise-driven</option>
            </select>
          </div>
        </div>

        <div class="settingRow" data-key="direction" id="directionRow">
          <div class="settingRowInner">
            <span class="settingName">Direction</span>
            <span class="settingVal" id="directionVal">Horizontal</span>
          </div>
          <div class="settingControl">
            <select id="direction" class="bigSelect">
              <option value="horizontal" selected>Horizontal</option>
              <option value="vertical">Vertical</option>
              <option value="diagonal">Diagonal</option>
              <option value="radial">Radial</option>
              <option value="chaotic">Chaotic</option>
            </select>
          </div>
        </div>

        <!-- Color pickers -->
        <div class="settingRow" data-key="color1" id="color1Row">
          <div class="settingRowInner">
            <span class="settingName">Color 1</span>
            <span class="colorDot" id="color1Dot" style="background:#3b82f6;"></span>
          </div>
          <div class="settingControl">
            <div class="colorPickerInline" data-target="color1"></div>
          </div>
          <input type="hidden" id="color1" value="#3b82f6">
        </div>

        <div class="settingRow" data-key="color2" id="color2Row">
          <div class="settingRowInner">
            <span class="settingName">Color 2</span>
            <span class="colorDot" id="color2Dot" style="background:#a855f7;"></span>
          </div>
          <div class="settingControl">
            <div class="colorPickerInline" data-target="color2"></div>
          </div>
          <input type="hidden" id="color2" value="#a855f7">
        </div>

        <div class="settingRow" data-key="color3" id="color3Row">
          <div class="settingRowInner">
            <span class="settingName">Color 3</span>
            <span class="colorDot" id="color3Dot" style="background:#f472b6;"></span>
          </div>
          <div class="settingControl">
            <div class="colorPickerInline" data-target="color3"></div>
          </div>
          <input type="hidden" id="color3" value="#f472b6">
        </div>

        <div class="settingRow" data-key="color4" id="color4Row">
          <div class="settingRowInner">
            <span class="settingName">Color 4</span>
            <span class="colorDot" id="color4Dot" style="background:#34d399;"></span>
          </div>
          <div class="settingControl">
            <div class="colorPickerInline" data-target="color4"></div>
          </div>
          <input type="hidden" id="color4" value="#34d399">
        </div>
      </div>

      <!-- ── BACKGROUND ── -->
      <div class="settingsGroup">
        <div class="groupLabel">Background</div>

        <div class="settingRow" data-key="bgColor">
          <div class="settingRowInner">
            <span class="settingName">Background</span>
            <span class="colorDot" id="bgColorDot" style="background:#0d0f16;"></span>
          </div>
          <div class="settingControl">
            <div class="colorPickerInline" data-target="bgColor"></div>
          </div>
          <input type="hidden" id="bgColor" value="#0d0f16">
        </div>

        <div class="settingRow" data-key="bgTransparent">
          <div class="settingRowInner">
            <span class="settingName">Transparent bg</span>
            <span class="settingVal" id="bgTransparentVal">Off</span>
          </div>
          <div class="settingControl">
            <div class="toggleWrap">
              <button class="toggleBtn" id="bgTransparentToggle" data-on="false">Off</button>
            </div>
          </div>
          <input type="hidden" id="bgTransparent" value="false">
        </div>
      </div>

      <!-- ── OUTPUT ── -->
      <div class="settingsGroup">
        <div class="groupLabel">Output</div>

        <div class="settingRow" data-key="size">
          <div class="settingRowInner">
            <span class="settingName">Size</span>
            <span class="settingVal" id="sizeVal">Square 1500×1500</span>
          </div>
          <div class="settingControl">
            <select id="size" class="bigSelect">
              <option value="square" selected>Square 1500×1500</option>
              <option value="portrait">Portrait 900×1600</option>
              <option value="landscape">Landscape 1600×900</option>
              <option value="a17">Samsung A17 1080×2340</option>
              <option value="desktop">Desktop 1920×1080</option>
            </select>
          </div>
        </div>

        <div class="settingRow" data-key="seed">
          <div class="settingRowInner">
            <span class="settingName">Seed</span>
            <span class="settingVal" id="seedVal">1</span>
          </div>
          <div class="settingControl">
            <input type="range" id="seed" min="1" max="999999" step="1" value="1" class="bigSlider">
          </div>
        </div>

      </div>

    </div><!-- /settingsList -->
  </div><!-- /sheet -->

</div><!-- /appWrap -->

<!-- ── Custom color picker overlay ── -->
<div id="colorPickerOverlay" class="cpOverlay hidden">
  <div class="cpPanel">
    <div class="cpTitle" id="cpTitle">Pick a color</div>
    <div class="cpSLWrap">
      <canvas id="cpSLCanvas"></canvas>
      <div id="cpSLCursor" class="cpCursor"></div>
    </div>
    <div class="cpHueWrap">
      <canvas id="cpHueCanvas"></canvas>
      <div id="cpHueCursor" class="cpHueCursor"></div>
    </div>
    <div class="cpHexRow">
      <span class="cpHexLabel">#</span>
      <input type="text" id="cpHexInput" class="cpHexInput" maxlength="6" spellcheck="false">
      <div id="cpHexPreview" class="cpHexPreview"></div>
    </div>
    <div class="cpPresets" id="cpPresets"></div>
    <div class="cpButtons">
      <button class="cpBtn" id="cpCancel">Cancel</button>
      <button class="cpBtn primary" id="cpApply">Apply</button>
    </div>
  </div>
</div>

<script src="flow.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(function(e){
      console.warn("SW:", e);
    });
  }
</script>
</body>
</html>
